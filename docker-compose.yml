services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGINS: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # DATABASE_URL: postgresql://ucanvas:ucanvas@postgres:5432/ucanvas
    # Uncomment once a database is chosen:
    # depends_on:
    #   - postgres

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - '8080:8080'
    depends_on:
      - api

