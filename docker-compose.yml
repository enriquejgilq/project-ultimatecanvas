services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    # Not published: the browser reaches the API through the web container's nginx (/api/).
    expose:
      - '3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGINS: http://localhost:8080
      JWT_SECRET: ${JWT_SECRET}
      APP_WEB_URL: http://localhost:8080
      TRUST_PROXY: 'true'
      # Production requires SMTP (console transport is rejected).
      MAIL_TRANSPORT: smtp
      SMTP_URL: ${SMTP_URL}
      MAIL_FROM: ${MAIL_FROM:-UltimateCanvas <no-reply@localhost>}
      # DATABASE_URL: postgresql://ucanvas:ucanvas@postgres:5432/ucanvas
    # Uncomment once a database is chosen:
    # depends_on:
    #   - postgres

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - '8080:8080'
    depends_on:
      - api

